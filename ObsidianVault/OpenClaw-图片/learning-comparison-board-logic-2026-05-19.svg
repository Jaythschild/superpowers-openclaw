<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">学习成绩对比：从信息堆叠到板书式推演</title>
  <desc id="desc">左侧展示学习前的信息堆叠式报告，右侧展示学习后的结论、证据、行动路径。</desc>
  <rect width="1600" height="900" fill="#f5f2ea"/>
  <rect x="56" y="48" width="1488" height="804" rx="18" fill="#fffaf0" stroke="#1f2937" stroke-width="2"/>
  <text x="100" y="112" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="42" font-weight="700" fill="#172033">学习成绩对比</text>
  <text x="100" y="156" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="24" fill="#566173">同一组报告内容，从“堆材料”改成“板书式推演”</text>
  <line x1="800" y1="198" x2="800" y2="806" stroke="#d7d0c2" stroke-width="2" stroke-dasharray="8 10"/>
  <g transform="translate(100 220)">
    <text x="0" y="0" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="30" font-weight="700" fill="#7c2d12">学习前：信息堆叠</text>
    <text x="0" y="36" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="18" fill="#6b7280">读者要自己找重点，图片只是陪衬</text>
    <rect x="0" y="74" width="620" height="440" rx="10" fill="#fff" stroke="#d9d4ca" stroke-width="2"/>
    <rect x="26" y="104" width="250" height="78" rx="8" fill="#e9eef8"/>
    <text x="46" y="139" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="22" font-weight="700" fill="#344767">AI 日报趋势</text>
    <text x="46" y="166" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="15" fill="#687385">标题像栏目名</text>
    <rect x="312" y="104" width="250" height="78" rx="8" fill="#f7ead8"/>
    <text x="332" y="139" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="22" font-weight="700" fill="#7c4a12">工具更新</text>
    <text x="332" y="166" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="15" fill="#7b6146">缺少判断</text>
    <rect x="26" y="214" width="250" height="102" rx="8" fill="#e8f3ee"/>
    <text x="46" y="248" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="20" font-weight="700" fill="#22543d">开源项目</text>
    <text x="46" y="278" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="15" fill="#4b6358">热度、模型、案例混在一起</text>
    <rect x="312" y="214" width="250" height="102" rx="8" fill="#efe7f7"/>
    <text x="332" y="248" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="20" font-weight="700" fill="#553c7b">多模态</text>
    <text x="332" y="278" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="15" fill="#675a76">看完仍要自己归纳</text>
    <rect x="26" y="354" width="536" height="86" rx="8" fill="#f3f4f6"/>
    <text x="46" y="388" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="18" fill="#374151">来源 A / 来源 B / GitHub / Hugging Face</text>
    <text x="46" y="416" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="15" fill="#6b7280">信息完整，但没有阅读路径</text>
    <g stroke="#c2410c" stroke-width="3" fill="none" opacity="0.75">
      <path d="M282 143 C300 190, 245 211, 275 263"/>
      <path d="M310 263 C285 315, 355 330, 298 393"/>
      <path d="M563 144 C586 207, 530 236, 562 310"/>
    </g>
    <text x="0" y="574" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="20" font-weight="700" fill="#7c2d12">主要问题</text>
    <text x="0" y="610" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="18" fill="#374151">1. 主线不突出  2. 证据不成组  3. 没有行动收束</text>
  </g>
  <g transform="translate(880 220)">
    <text x="0" y="0" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="30" font-weight="700" fill="#14532d">学习后：板书式推演</text>
    <text x="0" y="36" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="18" fill="#6b7280">结论先行，证据分组，最后落到行动</text>
    <rect x="0" y="74" width="620" height="440" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <rect x="34" y="104" width="552" height="82" rx="10" fill="#172033"/>
    <text x="58" y="139" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="24" font-weight="700" fill="#ffffff">Agent 工具链是本期最值得跟进的主线</text>
    <text x="58" y="167" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="16" fill="#cbd5e1">先给判断，再让证据服务判断</text>
    <g transform="translate(34 226)">
      <rect x="0" y="0" width="164" height="118" rx="10" fill="#e7f0ff" stroke="#2563eb" stroke-width="2"/>
      <text x="20" y="34" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">证据 1</text>
      <text x="20" y="66" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="16" fill="#334155">Skill / CLI</text>
      <text x="20" y="92" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="16" fill="#334155">更新变快</text>
    </g>
    <g transform="translate(228 226)">
      <rect x="0" y="0" width="164" height="118" rx="10" fill="#fff4e5" stroke="#ea580c" stroke-width="2"/>
      <text x="20" y="34" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="18" font-weight="700" fill="#c2410c">证据 2</text>
      <text x="20" y="66" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="16" fill="#334155">账号内容</text>
      <text x="20" y="92" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="16" fill="#334155">集中到实践</text>
    </g>
    <g transform="translate(422 226)">
      <rect x="0" y="0" width="164" height="118" rx="10" fill="#e7f8ed" stroke="#16a34a" stroke-width="2"/>
      <text x="20" y="34" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="18" font-weight="700" fill="#15803d">证据 3</text>
      <text x="20" y="66" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="16" fill="#334155">开源项目</text>
      <text x="20" y="92" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="16" fill="#334155">可纳入工作流</text>
    </g>
    <path d="M118 204 L118 226" stroke="#2563eb" stroke-width="3"/>
    <path d="M310 204 L310 226" stroke="#ea580c" stroke-width="3"/>
    <path d="M504 204 L504 226" stroke="#16a34a" stroke-width="3"/>
    <rect x="34" y="378" width="552" height="72" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="58" y="407" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="20" font-weight="700" fill="#14532d">行动建议</text>
    <text x="58" y="434" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="17" fill="#334155">把高价值 Skill / CLI 标记为：立即安装、继续观察、暂缓。</text>
    <text x="0" y="574" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="20" font-weight="700" fill="#14532d">可见进步</text>
    <text x="0" y="610" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="18" fill="#374151">1. 结论更早出现  2. 证据有分组  3. 读者知道下一步</text>
  </g>
  <text x="100" y="828" font-family="Arial, ''Microsoft YaHei'', sans-serif" font-size="16" fill="#6b7280">本次训练重点：让图片承担解释功能，而不是只负责装饰。</text>
</svg>