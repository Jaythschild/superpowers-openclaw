<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#FAFAF8"/>
  <text x="70" y="78" font-size="38" font-family="Microsoft YaHei, Arial" fill="#172033" font-weight="700">示例 3｜颜色不是装饰，是信息角色</text>
  <rect x="100" y="150" width="1000" height="430" rx="26" fill="#FFFFFF" stroke="#DDD6CC" stroke-width="2"/>
  <rect x="155" y="215" width="210" height="250" rx="18" fill="#172033"/>
  <text x="190" y="280" font-size="28" font-family="Microsoft YaHei" fill="#FFFFFF" font-weight="700">深色</text>
  <text x="190" y="335" font-size="24" font-family="Microsoft YaHei" fill="#FFFFFF">主结论</text>
  <text x="190" y="382" font-size="22" font-family="Microsoft YaHei" fill="#CBD5E1">只能给最重要</text>
  <text x="190" y="424" font-size="22" font-family="Microsoft YaHei" fill="#CBD5E1">的信息使用</text>
  <rect x="390" y="215" width="210" height="250" rx="18" fill="#DDEEF7"/>
  <text x="425" y="280" font-size="28" font-family="Microsoft YaHei" fill="#14536B" font-weight="700">蓝色</text>
  <text x="425" y="335" font-size="24" font-family="Microsoft YaHei" fill="#14536B">证据路径</text>
  <text x="425" y="382" font-size="22" font-family="Microsoft YaHei" fill="#36576A">用于数据、步骤</text>
  <text x="425" y="424" font-size="22" font-family="Microsoft YaHei" fill="#36576A">和逻辑连接</text>
  <rect x="625" y="215" width="210" height="250" rx="18" fill="#FBE7D3"/>
  <text x="660" y="280" font-size="28" font-family="Microsoft YaHei" fill="#9A3412" font-weight="700">橙色</text>
  <text x="660" y="335" font-size="24" font-family="Microsoft YaHei" fill="#9A3412">风险提醒</text>
  <text x="660" y="382" font-size="22" font-family="Microsoft YaHei" fill="#7C4A23">只提示转折</text>
  <text x="660" y="424" font-size="22" font-family="Microsoft YaHei" fill="#7C4A23">异常和注意点</text>
  <rect x="860" y="215" width="210" height="250" rx="18" fill="#DFF3E8"/>
  <text x="895" y="280" font-size="28" font-family="Microsoft YaHei" fill="#23613F" font-weight="700">绿色</text>
  <text x="895" y="335" font-size="24" font-family="Microsoft YaHei" fill="#23613F">行动建议</text>
  <text x="895" y="382" font-size="22" font-family="Microsoft YaHei" fill="#315C45">用于收束</text>
  <text x="895" y="424" font-size="22" font-family="Microsoft YaHei" fill="#315C45">下一步动作</text>
  <text x="100" y="665" font-size="25" font-family="Microsoft YaHei" fill="#4A5568">反例：每个模块都用高饱和颜色，会让读者无法判断哪里最重要。</text>
</svg>
